version: 2
updates:
  # Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/shared/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/services/auth"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/catalog"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/inventory"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/order"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/payment"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/notification"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker image updates
  - package-ecosystem: "docker"
    directory: "/services/auth"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/catalog"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/inventory"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/order"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/payment"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/notification"
    schedule:
      interval: "weekly"

  # GitHub Actions version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
