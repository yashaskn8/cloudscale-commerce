global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'null-receiver'

receivers:
  - name: 'null-receiver'
    # In a full production deployment, we would wire this up to PagerDuty/Slack.
    # For local validation, we log all alerts to stdout.
