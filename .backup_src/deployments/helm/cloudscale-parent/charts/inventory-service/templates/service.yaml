apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudscale.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudscale.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudscale.selectorLabels" . | nindent 4 }}
