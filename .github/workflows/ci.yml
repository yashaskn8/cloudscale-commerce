name: CloudScale Commerce CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black

    - name: Run Ruff Linter
      run: ruff check .

    - name: Run Black Formatter Check
      run: black --check .

    - name: Install Shared Package & Service Dependencies
      run: |
        pip install -e shared/python
        for service in auth catalog inventory order payment notification; do
          if [ -f services/$service/requirements.txt ]; then
            pip install -r services/$service/requirements.txt
          fi
        done

    - name: Run Verification Compilations
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "*/.*" -not -path "./.venv/*")

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v2

    - name: Build Auth Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/auth/Dockerfile
        push: false

    - name: Build Catalog Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/catalog/Dockerfile
        push: false

    - name: Build Inventory Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/inventory/Dockerfile
        push: false

    - name: Build Order Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/order/Dockerfile
        push: false

    - name: Build Payment Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/payment/Dockerfile
        push: false

    - name: Build Notification Service Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/notification/Dockerfile
        push: false
