name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio pytest-cov

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .

      - name: Run MyPy Type Check
        run: mypy .

  test-services:
    name: Test Suite (${{ matrix.service }})
    needs: lint-and-format
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudscale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, inventory, order, payment, notification]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install shared package & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./shared/python
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          fi
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Tests
        env:
          PYTHONPATH: services/${{ matrix.service }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cloudscale_test
        run: |
          pytest --asyncio-mode=auto --cov=services/${{ matrix.service }}/app --cov-report=xml services/${{ matrix.service }}/tests/

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: coverage.xml
