name: Release & Container Publishing

on:
  push:
    branches: [ main ]

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: write # Required for Git tagging and releases

jobs:
  semantic-version:
    name: Auto Versioning & Release Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump_version
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

  build-and-push:
    name: Build & Push ({{ matrix.service }})
    needs: semantic-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, catalog, inventory, order, payment, notification]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image (with cache)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloudscale/${{ matrix.service }}-service:${{ needs.semantic-version.outputs.new_tag }}
            ${{ steps.login-ecr.outputs.registry }}/cloudscale/${{ matrix.service }}-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm:
    name: Publish Helm Charts
    needs: [semantic-version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR (for Helm)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Package & Push parent chart to ECR
        run: |
          helm package deployments/helm/cloudscale-parent/ --version ${{ needs.semantic-version.outputs.new_tag }} --app-version ${{ needs.semantic-version.outputs.new_tag }}
          helm push cloudscale-parent-${{ needs.semantic-version.outputs.new_tag }}.tgz oci://${{ steps.login-ecr.outputs.registry }}/helm

  create-github-release:
    name: Create GitHub Release
    needs: [semantic-version, publish-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ needs.semantic-version.outputs.new_tag }}",
            });
            core.setOutput("notes", data.body);

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.semantic-version.outputs.new_tag }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
