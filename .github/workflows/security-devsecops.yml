name: DevSecOps Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-scan:
    name: Bandit SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r shared/ services/ -ll --exclude '*/tests/*'

  helm-validation:
    name: Helm Chart & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Helm Lint
        run: helm lint deployments/helm/cloudscale-parent/

      - name: Helm Template Verification
        run: |
          helm template cloudscale deployments/helm/cloudscale-parent/ -f deployments/helm/cloudscale-parent/values-dev.yaml
          helm template cloudscale deployments/helm/cloudscale-parent/ -f deployments/helm/cloudscale-parent/values-prod.yaml

  container-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, catalog, inventory, order, payment, notification]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Mock Image for Scanning
        run: docker build -t cloudscale/${{ matrix.service }}-service:test -f services/${{ matrix.service }}/Dockerfile .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudscale/${{ matrix.service }}-service:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sbom-generation:
    name: SBOM & Container Signing Provisioning
    needs: [sast-scan, container-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom-artifact
          path: sbom.spdx.json
