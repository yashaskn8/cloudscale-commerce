name: DevSecOps Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-scan:
    name: Bandit SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r shared/ services/ -ll --exclude '*/tests/*,*/grpc/*,*/alembic/*'

  helm-validation:
    name: Helm Chart & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.12.0'

      - name: Helm Lint
        run: helm lint deployments/helm/cloudscale-parent/

      - name: Helm Template Verification
        run: |
          helm template cloudscale deployments/helm/cloudscale-parent/ -f deployments/helm/cloudscale-parent/values-dev.yaml
          helm template cloudscale deployments/helm/cloudscale-parent/ -f deployments/helm/cloudscale-parent/values-prod.yaml

  container-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, catalog, inventory, order, payment, notification]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Mock Image for Scanning
        run: docker build -t cloudscale/${{ matrix.service }}-service:test -f services/${{ matrix.service }}/Dockerfile .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cloudscale/${{ matrix.service }}-service:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sbom-generation:
    name: SBOM & Container Signing Provisioning
    needs: [sast-scan, container-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-artifact
          path: sbom.spdx.json

      - name: Sign Container Images (Keyless via Sigstore OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Signing container images with Cosign keyless (Fulcio/Rekor)..."
          for SERVICE in auth catalog inventory order payment notification; do
            IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}-service:${{ github.sha }}"
            echo "Signing ${IMAGE}..."
            cosign sign --yes "${IMAGE}"
          done
          echo "All container images signed and attestations recorded in Rekor transparency log."
