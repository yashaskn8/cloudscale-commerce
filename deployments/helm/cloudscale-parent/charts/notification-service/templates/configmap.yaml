apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudscale.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudscale.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Chart.Name }}
  DATABASE_URL: "sqlite+aiosqlite:////app/data/notification_inbox.db"
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.global.kafka.bootstrapServers | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otel.endpoint | quote }}
