apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudscale.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudscale.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "cloudscale.selectorLabels" . | nindent 6 }}
