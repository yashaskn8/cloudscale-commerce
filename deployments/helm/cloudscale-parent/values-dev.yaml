# Development environment: Minimal resources, single replicas, no HPA, debug logging.
global:
  namespace: cloudscale-dev

auth-service:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

