# Production environment: High availability, aggressive HPAs, strict resource limits, anti-affinity enabled.
global:
  namespace: cloudscale-prod
  imagePullPolicy: Always

auth-service:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 65
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

catalog-service:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilization: 65
  resources:
