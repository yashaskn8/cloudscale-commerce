global:
  namespace: cloudscale
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

  postgres:
    host: postgres
    port: 5432
    user: postgres
    password: postgres

  redis:
    host: redis
    port: 6379

  kafka:
    bootstrapServers: kafka:29092

  otel:
    endpoint: http://otel-collector:4317

  jwt:
    secretKey: supersecretkeyforcloudscalecommercejwtissuancechangeinprod
    algorithm: HS256

# ── Sub-chart toggles ──────────────────────────────────────────────────────────
auth-service:
  enabled: true
  replicaCount: 2
  image:
    repository: cloudscale/auth-service
    tag: "1.0.0"
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  serviceAccount:
    create: true
    name: ""
  database:
    name: auth_db
    redisDb: "0"

