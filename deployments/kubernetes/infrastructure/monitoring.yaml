apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudscale
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          ports:
            - containerPort: 9090
              name: web
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudscale
  labels:
    app.kubernetes.io/name: prometheus
spec:
  ports:
    - port: 9090
  selector:
    app.kubernetes.io/name: prometheus
---
