apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: cloudscale
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.47
          ports:
            - containerPort: 16686
              name: web
            - containerPort: 4317
              name: otlp-grpc
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: cloudscale
  labels:
    app.kubernetes.io/name: jaeger
spec:
  ports:
    - port: 16686
      name: web
    - port: 4317
      name: otlp-grpc
  selector:
    app.kubernetes.io/name: jaeger
---
