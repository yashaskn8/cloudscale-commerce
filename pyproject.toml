[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "shared/python/cloudscale_shared/grpc",
    "**/alembic/**",
    ".venv",
    "venv",
    "node_modules",
    "frontend",
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit (flake8-bandit)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "S101",  # Use of assert detected (OK in tests)
    "S104",  # Possible binding to all interfaces
    "S106",  # Possible hardcoded password (handled by Secrets Manager)
]

[tool.ruff.per-file-ignores]
"**/tests/**" = ["S101", "S106"]

[tool.black]
target-version = ["py312"]
line-length = 120
exclude = '''
/(shared/python/cloudscale_shared/grpc|.*/alembic|.venv|venv|node_modules|frontend)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.pytest.ini_options]
testpaths = ["services/*/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
