syntax = "proto3";

package cloudscale.catalog;

option java_package = "com.cloudscale.catalog";

// Service for retrieving product details and validating prices.
// Used by Order Service during checkout to verify that the product
// exists and the submitted price matches the current catalog price.
service CatalogService {
  // Retrieves product details by ID. Returns NOT_FOUND if the product
  // does not exist or is inactive.
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);

  // Validates that the submitted prices match the catalog. Used during
  // order creation to prevent price manipulation.
  rpc ValidatePrices (ValidatePricesRequest) returns (ValidatePricesResponse);
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  string product_id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  // Price in smallest currency unit (e.g., cents) to avoid floating-point issues.
  int64 price_cents = 5;
  bool is_active = 6;
}

message PriceCheckItem {
  string product_id = 1;
  int64 submitted_price_cents = 2;
}

message ValidatePricesRequest {
  repeated PriceCheckItem items = 1;
}

message PriceValidationResult {
  string product_id = 1;
  bool valid = 2;
  int64 actual_price_cents = 3;
}

message ValidatePricesResponse {
  bool all_valid = 1;
  repeated PriceValidationResult results = 2;
}
