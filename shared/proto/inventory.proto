syntax = "proto3";

package cloudscale.inventory;

option java_package = "com.cloudscale.inventory";

// Service for querying real-time stock availability.
// Used synchronously by the API Gateway or Order Service to display
// stock status before initiating the asynchronous checkout Saga.
service InventoryService {
  // Returns the current stock level for a single product.
  rpc GetStockLevel (GetStockLevelRequest) returns (GetStockLevelResponse);

  // Batch query for stock levels across multiple products.
  // Used by the catalog listing page to display availability badges.
  rpc GetBatchStockLevels (GetBatchStockLevelsRequest) returns (GetBatchStockLevelsResponse);
}

message GetStockLevelRequest {
  string product_id = 1;
}

message GetStockLevelResponse {
  string product_id = 1;
  int32 available_stock = 2;
  int32 reserved_stock = 3;
  bool in_stock = 4;
}

message GetBatchStockLevelsRequest {
  repeated string product_ids = 1;
}

message GetBatchStockLevelsResponse {
  repeated GetStockLevelResponse levels = 1;
}
